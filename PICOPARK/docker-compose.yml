services:
  host:
    image: node:22-alpine
    container_name: picopark-host
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./host:/app
      - host_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

  gamepad:
    image: node:22-alpine
    container_name: picopark-gamepad
    working_dir: /app
    command: sh -c "npm install && npx expo start --lan --port 8081"
    volumes:
      - ./gamepad:/app
      - gamepad_node_modules:/app/node_modules
    ports:
      - "8081:8081"
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP}
      - EXPO_NO_TELEMETRY=1
      - EXPO_NO_DEPENDENCY_VALIDATION=1
    stdin_open: true
    tty: true
    depends_on:
      - host
    restart: unless-stopped

volumes:
  host_node_modules:
  gamepad_node_modules:
